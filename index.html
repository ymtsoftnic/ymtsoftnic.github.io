<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YMT IPTV PLAYER</title>

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --secondary-text: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --hover-bg: #334155;
            --star-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            height: 100dvh;
            min-height: 100dvh;
            max-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Header */
        header {
            flex-shrink: 0;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .header-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 700;
            white-space: nowrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 350px;
            min-width: 140px;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 0.4rem 2rem 0.4rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .clear-search-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 0 4px;
        }

        .clear-search-btn:hover {
            color: var(--text-color);
        }

        .status {
            color: var(--secondary-text);
            font-size: 0.75rem;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Playlist Bar */
        .playlist-bar {
            background-color: #1a2332;
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            z-index: 90;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .playlist-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            font-weight: 600;
            white-space: nowrap;
        }

        .playlist-select-container {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex: 1;
            min-width: 0;
        }

        .playlist-select {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 0;
            text-overflow: ellipsis;
        }

        .add-playlist-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .add-playlist-btn:hover {
            opacity: 0.9;
        }

        .delete-playlist-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            display: none;
            flex-shrink: 0;
        }

        .delete-playlist-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Layout Container */
        .layout-container {
            display: flex;
            flex-direction: row !important;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 150px;
            min-width: 150px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 0.6rem 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            height: 100%;
            overflow-y: auto;
            flex-shrink: 0;
            contain: content;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary-text);
            margin-bottom: 0.4rem;
            padding: 0 0.2rem;
            font-weight: 700;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-color);
            text-align: left;
            padding: 0.53rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            flex-shrink: 0;
        }

        .category-btn:hover {
            background-color: var(--hover-bg);
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
        }

        .category-btn.fav-btn-cat {
            color: var(--star-color);
            font-weight: 600;
        }

        .category-btn.fav-btn-cat.active {
            background-color: var(--star-color);
            color: #0f172a;
        }

        .category-btn.search-highlight {
            border: 2px solid var(--accent-color);
            background-color: rgba(56, 189, 248, 0.15);
            font-weight: bold;
        }

        /* Main Content Grid */
        .main-container {
            flex: 1;
            padding: 0.8rem;
            height: 100%;
            overflow-y: auto;
            contain: content;
            will-change: transform;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.8rem;
        }

        .channel-card {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            contain: content;
        }

        .channel-card:hover {
            border-color: var(--accent-color);
        }

        .fav-star {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 1.1rem;
            color: var(--secondary-text);
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            user-select: none;
        }

        .fav-star.active {
            color: var(--star-color);
        }

        .logo-container {
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            margin-top: 0.4rem;
            overflow: hidden;
            padding: 0.4rem;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-color);
            word-break: break-word;
        }

        .category-badge {
            font-size: 0.65rem;
            color: var(--accent-color);
            margin-top: 0.2rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .loading, .no-results {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 2rem;
            color: var(--secondary-text);
            grid-column: 1 / -1;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-body {
            background-color: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 0.6rem;
        }

        .modal-description {
            font-size: 0.82rem;
            color: var(--secondary-text);
            margin-bottom: 1.2rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--secondary-text);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: var(--hover-bg);
            color: var(--text-color);
        }

        .btn-save {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .success-modal-content {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 360px;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .close-success-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .success-icon {
            font-size: 2.2rem;
            color: var(--success-color);
            margin-bottom: 0.5rem;
        }

        .success-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        /* Player Modal Window */
        .player-modal .player-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .player-header {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        .player-title {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Hidden Frame Container for Ads */
        #ad-frame-container {
            display: none;
            width: 0;
            height: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Main Header -->
    <header>
        <div class="header-container">
            <h1>YMT IPTV PLAYER</h1>
            
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search all channels..."
                    disabled
                >
                <button id="clearSearchBtn" class="clear-search-btn" title="Clear search">&times;</button>
            </div>

            <div class="status" id="status">Fetching Channels...</div>
        </div>
    </header>

    <!-- Playlist Management Bar -->
    <div class="playlist-bar">
        <span class="playlist-label">Playlist:</span>
        <div class="playlist-select-container">
            <select id="playlistSelect" class="playlist-select" onchange="switchPlaylist(this.value)">
                <!-- Dynamic Options -->
            </select>
            <button id="deletePlaylistBtn" class="delete-playlist-btn" title="Delete current playlist" onclick="deleteCurrentPlaylist()">✕</button>
        </div>
        <button class="add-playlist-btn" onclick="openAddPlaylistModal()">
            <span>+</span> Add Playlist
        </button>
    </div>

    <!-- Main App Layout -->
    <div class="layout-container">
        <!-- Dynamic Sidebar Categories -->
        <aside class="sidebar">
            <div class="sidebar-title">Categories</div>
            <div id="categoryList">
                <div class="loading" style="font-size:0.75rem; margin:0.5rem 0;">Loading...</div>
            </div>
        </aside>

        <!-- Channels Grid -->
        <main class="main-container" id="mainContainer">
            <div id="channelsContainer" class="channels-grid">
                <div id="loading" class="loading">⏳ Fetching playlist channels...</div>
            </div>
        </main>
    </div>

    <!-- Add Playlist Modal -->
    <div id="addPlaylistModal" class="modal">
        <div class="modal-body">
            <div class="modal-title">Add Channel Playlist</div>
            <div class="modal-description">
                Enter the playlist name and the URL of the channel list in m3u or m3u8 format.
            </div>
            <div class="form-group">
                <label for="playlistNameInput">Playlist Name</label>
                <input type="text" id="playlistNameInput" class="form-input" placeholder="e.g. Sports Channels">
            </div>
            <div class="form-group">
                <label for="playlistUrlInput">Playlist URL (.m3u / .m3u8)</label>
                <input type="url" id="playlistUrlInput" class="form-input" placeholder="https://example.com/playlist.m3u">
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeAddPlaylistModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveNewPlaylist()">Save</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="success-modal-content">
            <button class="close-success-btn" onclick="closeSuccessModal()" title="Close">&times;</button>
            <div class="success-icon">✓</div>
            <div class="success-text">Playlist added successfully!</div>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="modal player-modal">
        <div class="player-content">
            <div class="player-header">
                <span id="playingChannelName" class="player-title">Channel Name</span>
                <div class="header-actions">
                    <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
                    <button class="icon-btn close-btn" onclick="closePlayer()" title="Close">&times;</button>
                </div>
            </div>
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" controls autoplay playsinline webkit-playsinline></video>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION LOGIC WITH RAM CACHING -->
    <script>
        const DEFAULT_PLAYLIST_ID = 'default_global';
        const DEFAULT_PLAYLIST = {
            id: DEFAULT_PLAYLIST_ID,
            name: 'Global Playlist (Default)',
            url: 'https://iptv-org.github.io/iptv/index.language.m3u'
        };
        const DEFAULT_LOGO = 'https://via.placeholder.com/150/1e293b/38bdf8?text=NO+LOGO';
        const FAVORITES_KEY = 'ymt_iptv_favorites_v1';
        const PLAYLISTS_KEY = 'ymt_iptv_playlists_v1';
        const CACHE_KEY_PREFIX = 'ymt_m3u_cache_';

        const BATCH_SIZE = 80;
        let renderedIndex = 0;
        let isSearching = false;

        let playlists = [];
        let currentPlaylistId = DEFAULT_PLAYLIST_ID;
        let allChannels = [];
        let categoriesMap = {};
        let currentDisplayedChannels = [];
        let currentCategoryName = '';
        let favoritesMap = {};
        let hlsInstance = null;
        let searchDebounceTimer = null;

        function loadPlaylistsFromStorage() {
            try {
                const saved = localStorage.getItem(PLAYLISTS_KEY);
                playlists = saved ? JSON.parse(saved) : [DEFAULT_PLAYLIST];
            } catch (e) {
                playlists = [DEFAULT_PLAYLIST];
            }
        }

        function savePlaylistsToStorage() {
            try {
                localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
            } catch (e) {}
        }

        function loadFavoritesFromStorage() {
            try {
                const saved = localStorage.getItem(FAVORITES_KEY);
                favoritesMap = saved ? JSON.parse(saved) : {};
            } catch (e) {
                favoritesMap = {};
            }
        }

        function saveFavoritesToStorage() {
            try {
                localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoritesMap));
            } catch (e) {}
        }

        async function initApp() {
            loadFavoritesFromStorage();
            loadPlaylistsFromStorage();
            renderPlaylistSelect();
            
            document.getElementById('mainContainer').addEventListener('scroll', handleScroll, { passive: true });
            await loadPlaylistData(DEFAULT_PLAYLIST.url, DEFAULT_PLAYLIST_ID);
        }

        function handleScroll() {
            const container = document.getElementById('mainContainer');
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 400) {
                renderNextBatch();
            }
        }

        function renderPlaylistSelect() {
            const selectEl = document.getElementById('playlistSelect');
            const deleteBtn = document.getElementById('deletePlaylistBtn');
            selectEl.innerHTML = '';

            playlists.forEach(pl => {
                const option = document.createElement('option');
                option.value = pl.id;
                option.textContent = pl.name;
                selectEl.appendChild(option);
            });

            selectEl.value = currentPlaylistId;
            deleteBtn.style.display = (currentPlaylistId === DEFAULT_PLAYLIST_ID) ? 'none' : 'block';
        }

        async function switchPlaylist(playlistId) {
            currentPlaylistId = playlistId;
            const targetPlaylist = playlists.find(p => p.id === playlistId);
            if (!targetPlaylist) return;

            document.getElementById('deletePlaylistBtn').style.display = 
                (currentPlaylistId === DEFAULT_PLAYLIST_ID) ? 'none' : 'block';

            clearSearchInputOnly();
            await loadPlaylistData(targetPlaylist.url, targetPlaylist.id);
        }

        // LOAD PLAYLIST WITH LOCAL STORAGE RAM CACHING
        async function loadPlaylistData(url, cacheId) {
            const statusEl = document.getElementById('status');
            const containerEl = document.getElementById('channelsContainer');
            const searchInput = document.getElementById('searchInput');

            statusEl.textContent = 'Loading Channels...';
            containerEl.innerHTML = '<div class="loading">⏳ Reading channels from Cache...</div>';
            searchInput.disabled = true;

            const cacheKey = CACHE_KEY_PREFIX + cacheId;
            const cachedText = localStorage.getItem(cacheKey);

            if (cachedText) {
                parseM3U(cachedText);
                setupLoadedChannels();
                
                fetch(url).then(res => res.text()).then(freshText => {
                    localStorage.setItem(cacheKey, freshText);
                }).catch(() => {});
                return;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to load Playlist');
                
                const m3uText = await response.text();
                try { localStorage.setItem(cacheKey, m3uText); } catch(e){}

                parseM3U(m3uText);
                setupLoadedChannels();

            } catch (error) {
                statusEl.textContent = 'Error loading playlist.';
                containerEl.innerHTML = '<div class="no-results">Failed to fetch playlist data.</div>';
            }
        }

        function setupLoadedChannels() {
            const statusEl = document.getElementById('status');
            const searchInput = document.getElementById('searchInput');
            const catNames = Object.keys(categoriesMap);

            if (catNames.length === 0) {
                statusEl.textContent = 'No channels found.';
                document.getElementById('channelsContainer').innerHTML = '<div class="no-results">Empty playlist.</div>';
                return;
            }

            statusEl.textContent = `Loaded ${allChannels.length} total channels.`;
            searchInput.disabled = false;

            renderSidebar(catNames);
            selectCategory('All');
        }

        function isValidM3uUrl(urlStr) {
            try {
                const url = new URL(urlStr);
                const path = url.pathname.toLowerCase();
                return path.endsWith('.m3u') || path.endsWith('.m3u8') || urlStr.toLowerCase().includes('.m3u');
            } catch (e) {
                return false;
            }
        }

        function openAddPlaylistModal() {
            document.getElementById('playlistNameInput').value = '';
            document.getElementById('playlistUrlInput').value = '';
            document.getElementById('addPlaylistModal').classList.add('active');
        }

        function closeAddPlaylistModal() {
            document.getElementById('addPlaylistModal').classList.remove('active');
        }

        function openSuccessModal() {
            document.getElementById('successModal').classList.add('active');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        async function saveNewPlaylist() {
            const nameInput = document.getElementById('playlistNameInput').value.trim();
            const urlInput = document.getElementById('playlistUrlInput').value.trim();

            if (!nameInput || !urlInput) {
                alert('Please enter both Playlist Name and URL.');
                return;
            }

            if (!isValidM3uUrl(urlInput)) {
                alert('Please enter a valid .m3u or .m3u8 URL.');
                return;
            }

            const newPlaylist = {
                id: 'pl_' + Date.now(),
                name: nameInput,
                url: urlInput
            };

            playlists.push(newPlaylist);
            savePlaylistsToStorage();
            
            closeAddPlaylistModal();
            openSuccessModal();

            currentPlaylistId = newPlaylist.id;
            renderPlaylistSelect();
            await switchPlaylist(currentPlaylistId);
        }

        function deleteCurrentPlaylist() {
            if (currentPlaylistId === DEFAULT_PLAYLIST_ID) return;

            if (confirm('Are you sure you want to delete this playlist?')) {
                localStorage.removeItem(CACHE_KEY_PREFIX + currentPlaylistId);
                playlists = playlists.filter(p => p.id !== currentPlaylistId);
                savePlaylistsToStorage();

                currentPlaylistId = DEFAULT_PLAYLIST_ID;
                renderPlaylistSelect();
                switchPlaylist(DEFAULT_PLAYLIST_ID);
            }
        }

        // FAST OPTIMIZED PARSER
        function parseM3U(content) {
            const lines = content.split('\n');
            allChannels = [];
            categoriesMap = { 'All': [] };

            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const groupMatch = line.match(/group-title="([^"]*)"/);

                    const logo = logoMatch ? logoMatch[1] : DEFAULT_LOGO;
                    const group = groupMatch && groupMatch[1] ? groupMatch[1].trim() : 'General';

                    const commaIdx = line.lastIndexOf(',');
                    const name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unknown Channel';

                    currentChannel = {
                        name: name,
                        logo: logo,
                        category: group,
                        url: ''
                    };
                } else if (!line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    
                    allChannels.push(currentChannel);
                    categoriesMap['All'].push(currentChannel);

                    if (!categoriesMap[currentChannel.category]) {
                        categoriesMap[currentChannel.category] = [];
                    }
                    categoriesMap[currentChannel.category].push(currentChannel);

                    currentChannel = null;
                }
            }
        }

        function renderSidebar(categories) {
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = '';

            const favCount = Object.keys(favoritesMap).length;
            const favBtn = document.createElement('button');
            favBtn.className = 'category-btn fav-btn-cat';
            favBtn.id = 'cat-fav-btn';
            favBtn.setAttribute('data-category', '⭐ Favorites');
            favBtn.textContent = `⭐ Favorites (${favCount})`;
            favBtn.onclick = () => handleCategoryClick(favBtn, '⭐ Favorites');
            categoryList.appendChild(favBtn);

            categories.forEach((cat) => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat === 'All' ? 'active' : ''}`;
                btn.setAttribute('data-category', cat);
                btn.textContent = `${cat} (${categoriesMap[cat].length})`;
                btn.onclick = () => handleCategoryClick(btn, cat);
                categoryList.appendChild(btn);
            });
        }

        function handleCategoryClick(btn, categoryName) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('active', 'search-highlight');
            });
            btn.classList.add('active');
            selectCategory(categoryName);
        }

        function updateFavSidebarCounter() {
            const favBtn = document.getElementById('cat-fav-btn');
            if (favBtn) {
                const favCount = Object.keys(favoritesMap).length;
                favBtn.textContent = `⭐ Favorites (${favCount})`;
            }
        }

        function selectCategory(categoryName) {
            clearSearchInputOnly();
            currentCategoryName = categoryName;

            if (categoryName === '⭐ Favorites') {
                currentDisplayedChannels = Object.values(favoritesMap);
            } else {
                currentDisplayedChannels = categoriesMap[categoryName] || [];
            }
            
            document.getElementById('status').textContent = `${categoryName}: ${currentDisplayedChannels.length} Channels`;
            initBatchRendering(currentDisplayedChannels, false);
        }

        function toggleFavorite(event, channel) {
            event.stopPropagation();

            if (favoritesMap[channel.url]) {
                delete favoritesMap[channel.url];
            } else {
                favoritesMap[channel.url] = channel;
            }

            saveFavoritesToStorage();
            updateFavSidebarCounter();

            if (currentCategoryName === '⭐ Favorites') {
                selectCategory('⭐ Favorites');
            } else {
                const starEl = event.currentTarget;
                const isFav = !!favoritesMap[channel.url];
                starEl.classList.toggle('active', isFav);
                starEl.textContent = isFav ? '⭐' : '☆';
            }
        }

        function initBatchRendering(channels, searchFlag = false) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';
            renderedIndex = 0;
            isSearching = searchFlag;

            if (channels.length === 0) {
                container.innerHTML = currentCategoryName === '⭐ Favorites' 
                    ? '<div class="no-results">No favorite channels added yet.</div>'
                    : '<div class="no-results">No channels found.</div>';
                return;
            }

            renderNextBatch();
            document.getElementById('mainContainer').scrollTop = 0;
        }

        function renderNextBatch() {
            if (renderedIndex >= currentDisplayedChannels.length) return;

            const container = document.getElementById('channelsContainer');
            const fragment = document.createDocumentFragment();
            const nextIndex = Math.min(renderedIndex + BATCH_SIZE, currentDisplayedChannels.length);

            for (let i = renderedIndex; i < nextIndex; i++) {
                fragment.appendChild(createChannelCard(currentDisplayedChannels[i], isSearching));
            }

            renderedIndex = nextIndex;
            container.appendChild(fragment);
        }

        function createChannelCard(channel, isSearch) {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.onclick = () => playChannel(channel);

            const isFav = !!favoritesMap[channel.url];
            const star = document.createElement('span');
            star.className = `fav-star ${isFav ? 'active' : ''}`;
            star.textContent = isFav ? '⭐' : '☆';
            star.onclick = (e) => toggleFavorite(e, channel);

            const logoBox = document.createElement('div');
            logoBox.className = 'logo-container';

            const img = document.createElement('img');
            img.src = channel.logo;
            img.alt = channel.name;
            img.loading = 'lazy';
            img.onerror = function() { this.src = DEFAULT_LOGO; };

            logoBox.appendChild(img);

            const nameEl = document.createElement('div');
            nameEl.className = 'channel-name';
            nameEl.textContent = channel.name;

            card.appendChild(star);
            card.appendChild(logoBox);
            card.appendChild(nameEl);

            if (isSearch && channel.category) {
                const badge = document.createElement('div');
                badge.className = 'category-badge';
                badge.textContent = `[${channel.category}]`;
                card.appendChild(badge);
            }

            return card;
        }

        function playChannel(channel) {
            const modal = document.getElementById('playerModal');
            const title = document.getElementById('playingChannelName');
            const video = document.getElementById('videoPlayer');

            title.textContent = channel.name;
            modal.classList.add('active');

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        function toggleFullscreen() {
            const video = document.getElementById('videoPlayer');
            const container = document.getElementById('videoContainer');

            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            } else if (container.requestFullscreen) {
                container.requestFullscreen();
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');

            modal.classList.remove('active');
            video.pause();
            
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        document.getElementById('playerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePlayer();
            }
        });

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const statusEl = document.getElementById('status');

            clearSearchBtn.style.display = searchTerm ? 'block' : 'none';

            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('search-highlight'));

                if (!searchTerm) {
                    statusEl.textContent = `${currentCategoryName}: ${currentDisplayedChannels.length} Channels`;
                    currentDisplayedChannels = (currentCategoryName === '⭐ Favorites') 
                        ? Object.values(favoritesMap) 
                        : (categoriesMap[currentCategoryName] || []);
                    initBatchRendering(currentDisplayedChannels, false);
                    return;
                }

                const filteredChannels = allChannels.filter(channel => 
                    channel.name.toLowerCase().includes(searchTerm)
                );

                statusEl.textContent = `Found ${filteredChannels.length} matching channels`;
                currentDisplayedChannels = filteredChannels;
                initBatchRendering(currentDisplayedChannels, true);
            }, 200);
        });

        function clearSearchInputOnly() {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('search-highlight'));
        }

        clearSearchBtn.addEventListener('click', () => {
            clearSearchInputOnly();
            currentDisplayedChannels = (currentCategoryName === '⭐ Favorites') 
                ? Object.values(favoritesMap) 
                : (categoriesMap[currentCategoryName] || []);
            initBatchRendering(currentDisplayedChannels, false);
            document.getElementById('status').textContent = `${currentCategoryName}: ${currentDisplayedChannels.length} Channels`;
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>

    <!-- AUTOMATIC RECURRING ADS SYSTEM VIA dynamic IFRAME REFRESH -->
    <div id="ad-frame-container"></div>
    <script>
        function triggerAdsReload() {
            const container = document.getElementById('ad-frame-container');
            container.innerHTML = ''; // إزالة الإطار القديم وتصفير السكربتات

            // إطار عمل معزول يضمن إعادة تنفيذ السكربتات بدون قيود الـ DOM Caching
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            container.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            const timeStamp = new Date().getTime(); // لكسر الـ Cache

            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head></head>
                <body>
                    <script src="https://5gvci.com/act/files/tag.min.js?z=11731887&cb=${timeStamp}" data-cfasync="false" async><\/script>
                    <script>
                        (function(s){s.dataset.zone='11731893';s.src='https://nap5k.com/tag.min.js?cb=${timeStamp}'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
                    <\/script>
                    <script>
                        (function(s){s.dataset.zone='11731900';s.src='https://n6wxm.com/vignette.min.js?cb=${timeStamp}'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
                    <\/script>
                </body>
                </html>
            `);
            doc.close();
        }

        // تشغيل مباشر
        triggerAdsReload();

        // تكرار إجباري كل 3 دقائق (180,000 مللي ثانية)
        setInterval(triggerAdsReload, 180000);
    </script>
