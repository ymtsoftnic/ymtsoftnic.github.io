<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YMT IPTV PLAYER</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --secondary-text: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --hover-bg: #334155;
            --star-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            height: 100dvh;
            min-height: 100dvh;
            max-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Header */
        header {
            flex-shrink: 0;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .header-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 700;
            white-space: nowrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 350px;
            min-width: 140px;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 0.4rem 2rem 0.4rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .clear-search-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 0 4px;
        }

        .clear-search-btn:hover {
            color: var(--text-color);
        }

        .status {
            color: var(--secondary-text);
            font-size: 0.75rem;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Playlist Bar */
        .playlist-bar {
            background-color: #1a2332;
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            z-index: 90;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .playlist-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            font-weight: 600;
            white-space: nowrap;
        }

        .playlist-select-container {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex: 1;
            min-width: 0;
        }

        .playlist-select {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 0;
            text-overflow: ellipsis;
        }

        .add-playlist-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .add-playlist-btn:hover {
            opacity: 0.9;
        }

        .delete-playlist-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            display: none;
            flex-shrink: 0;
        }

        .delete-playlist-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Layout Container */
        .layout-container {
            display: flex;
            flex-direction: row !important;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 150px;
            min-width: 150px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 0.6rem 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            height: 100%;
            overflow-y: auto;
            flex-shrink: 0;
            contain: content;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary-text);
            margin-bottom: 0.4rem;
            padding: 0 0.2rem;
            font-weight: 700;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-color);
            text-align: left;
            padding: 0.53rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            flex-shrink: 0;
        }

        .category-btn:hover {
            background-color: var(--hover-bg);
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
        }

        .category-btn.fav-btn-cat {
            color: var(--star-color);
            font-weight: 600;
        }

        .category-btn.fav-btn-cat.active {
            background-color: var(--star-color);
            color: #0f172a;
        }

        .category-btn.search-highlight {
            border: 2px solid var(--accent-color);
            background-color: rgba(56, 189, 248, 0.15);
            font-weight: bold;
        }

        /* Main Content Grid */
        .main-container {
            flex: 1;
            padding: 0.8rem;
            height: 100%;
            overflow-y: auto;
            contain: content;
            will-change: transform;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.8rem;
        }

        .channel-card {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            contain: content;
        }

        .channel-card:hover {
            border-color: var(--accent-color);
        }

        .fav-star {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 1.1rem;
            color: var(--secondary-text);
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            user-select: none;
        }

        .fav-star.active {
            color: var(--star-color);
        }

        .logo-container {
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            margin-top: 0.4rem;
            overflow: hidden;
            padding: 0.4rem;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-color);
            word-break: break-word;
        }

        .category-badge {
            font-size: 0.65rem;
            color: var(--accent-color);
            margin-top: 0.2rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .loading, .no-results {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 2rem;
            color: var(--secondary-text);
            grid-column: 1 / -1;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-body {
            background-color: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 0.6rem;
        }

        .modal-description {
            font-size: 0.82rem;
            color: var(--secondary-text);
            margin-bottom: 1.2rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--secondary-text);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: var(--hover-bg);
            color: var(--text-color);
        }

        .btn-save {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .success-modal-content {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 360px;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .close-success-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .success-icon {
            font-size: 2.2rem;
            color: var(--success-color);
            margin-bottom: 0.5rem;
        }

        .success-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        /* Player Modal Window */
        .player-modal .player-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .player-header {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        .player-title {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #ad-frame-container {
            display: none;
            width: 0;
            height: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>YMT IPTV PLAYER</h1>
            
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search all channels..."
                    disabled
                >
                <button id="clearSearchBtn" class="clear-search-btn" title="Clear search">&times;</button>
            </div>

            <div class="status" id="status">Fetching Channels...</div>
        </div>
    </header>

    <div class="playlist-bar">
        <span class="playlist-label">Playlist:</span>
        <div class="playlist-select-container">
            <select id="playlistSelect" class="playlist-select" onchange="switchPlaylist(this.value)">
                </select>
            <button id="deletePlaylistBtn" class="delete-playlist-btn" title="Delete current playlist" onclick
