        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentExt = null;

            for (let i = 0; i < lines.length; i++) {

                if (line.startsWith('#EXTINF:')) {

                        extinf: line,

                        group: groupMatch ? groupMatch[1].trim() : 'Uncategorized',
                        url: ''
                    };
                } else if (line && !line.startsWith('#') && currentExt) {
                    currentExt.url = line;
                    channels.push(currentExt);
                    currentExt = null;
                }
            }
            return channels;
        }

        async function processQueueWithPlayer() {
            const statusElem = document.getElementById('playerStatus');

            while (queueToProcess.length > 0 && isChecking) {

                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('exportBtn').style.display = 'block';
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').textContent = 'Restart Checklist Check';

            if (Hls.isSupported() && (channel.url.includes('.m3u8') || !videoElem.canPlayType('application/vnd.apple.mpegurl'))) {
                modalHlsInstance = new Hls();
                modalHlsInstance.loadSource(channel.url);
                modalHlsInstance.attachMedia(videoElem);
                modalHlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElem.play().catch(() => {});
                });
            } else {
                videoElem.src = channel.url;
                videoElem.play().catch(() => {});
            }
        }

        function closePlayerModal() {
            const modal = document.getElementById('playerModal');
            const videoElem = document.getElementById('modalVideoPlayer');

            modal.style.display = 'none';
            videoElem.pause();
            videoElem.removeAttribute('src');
            videoElem.load();

            if (modalHlsInstance) {
                modalHlsInstance.destroy();
                modalHlsInstance = null;
            }
        }

        function exportMergedList() {
            if (workingChannels.length === 0) return alert('No active channels to export.');

            let finalChannels = [...baseFileChannels];
            let addedCount = 0;
            let skippedDuplicates = 0;

            workingChannels.forEach(newCh => {
                const isDuplicate = finalChannels.some(existing => 
                    existing.name.trim().toLowerCase() === newCh.name.trim().toLowerCase() ||
                    existing.url.trim().toLowerCase() === newCh.url.trim().toLowerCase()
                );

                if (isDuplicate) {
                    skippedDuplicates++;
                } else {
                    if (!newCh.logo) newCh.logo = DEFAULT_LOGO_URL;
                    newCh.extinf = `#EXTINF:-1 tvg-logo="${newCh.logo}" group-title="${newCh.group}",${newCh.name}`;
                    finalChannels.push(newCh);
                    addedCount++;
                }
            });

            finalChannels.sort((a, b) => a.group.localeCompare(b.group));

            let fileContent = '#EXTM3U\n';
            finalChannels.forEach(ch => {
                fileContent += `${ch.extinf}\n${ch.url}\n`;
            });

            try {
                const blob = new Blob([fileContent], { type: 'audio/x-mpegurl;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = DEFAULT_EXPORT_NAME;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                alert(`✅ Playlist exported successfully!\n• Active channels added: ${addedCount}\n• Skipped duplicates: ${skippedDuplicates}`);
            } catch(e) {
                alert('Error downloading file.');
            }
        }

        function stopChecking() {
            isChecking = false;
            isPaused = false;
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('exportBtn').style.display = 'block';
            document.getElementById('playerStatus').textContent = 'Inspection stopped by user.';
        }
    </script>
</body>
